<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgCosmo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgCosmo)" stroke="#38bdf8" stroke-width="4"/>

  <!-- Distant Stars & Little Planet -->
  <circle cx="36" cy="48" r="2.5" fill="#fde047"/>
  <circle cx="164" cy="52" r="2" fill="#ffffff"/>
  <circle cx="155" cy="110" r="1.5" fill="#f472b6"/>
  <circle cx="44" cy="120" r="2" fill="#38bdf8"/>
  <circle cx="152" cy="38" r="7" fill="#fb923c"/>
  <ellipse cx="152" cy="38" rx="12" ry="3" fill="none" stroke="#fdba74" stroke-width="1.5"/>

  <!-- Spacesuit Shoulders -->
  <path d="M 58 135 C 72 122, 128 122, 142 135 L 152 182 L 48 182 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Mission Badge on Chest -->
  <circle cx="75" cy="148" r="6" fill="#ef4444"/>
  <path d="M 72 148 L 75 144 L 78 148 Z" fill="#ffffff"/>

  <!-- Big Astronaut Helmet -->
  <circle cx="100" cy="80" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <!-- Helmet Ears/Comm pods -->
  <rect x="52" y="72" width="7" height="16" rx="3.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="141" y="72" width="7" height="16" rx="3.5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

  <!-- Tinted Helmet Visor -->
  <ellipse cx="100" cy="80" rx="32" ry="26" fill="url(#visor)" stroke="#0284c7" stroke-width="2"/>
  <!-- Glare on Visor -->
  <ellipse cx="88" cy="72" rx="18" ry="10" fill="#ffffff" opacity="0.35" transform="rotate(-15 88 72)"/>

  <!-- Cartoon Eyes & Reading Glasses reflection inside visor -->
  <circle cx="88" cy="80" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="79" r="3" fill="#0f172a"/>
  <circle cx="112" cy="80" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="114" cy="79" r="3" fill="#0f172a"/>
  <path d="M 97 92 Q 100 95 103 92" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Zero-G Sci-Fi Book Floating in Hands -->
  <path d="M 100 134 L 54 124 Q 52 152 56 172 L 100 178 Z" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <path d="M 100 134 L 146 124 Q 148 152 144 172 L 100 178 Z" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <path d="M 50 124 L 100 136 L 150 124 L 148 174 L 100 181 L 52 174 Z" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round"/>

  <!-- Rocket bookmark on page -->
  <polygon points="76,140 79,134 82,140" fill="#ef4444"/>
  <rect x="78" y="140" width="2" height="10" fill="#f59e0b"/>
  <!-- Sci-fi text lines -->
  <line x1="64" y1="154" x2="88" y2="158" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="164" x2="86" y2="167" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="144" x2="136" y2="140" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="154" x2="134" y2="150" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="164" x2="136" y2="160" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>

  <!-- Spacesuit Gloves holding book -->
  <ellipse cx="54" cy="148" rx="8" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="146" cy="148" rx="8" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
</svg>
