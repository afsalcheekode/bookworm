<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="wormGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg1)" stroke="#ca8a04" stroke-width="4"/>

  <!-- Bookworm Body Segments -->
  <circle cx="48" cy="145" r="18" fill="url(#wormGrad)" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="68" cy="132" r="22" fill="url(#wormGrad)" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="92" cy="120" r="26" fill="url(#wormGrad)" stroke="#15803d" stroke-width="2.5"/>
  
  <!-- Bookworm Head -->
  <circle cx="100" cy="74" r="32" fill="url(#wormGrad)" stroke="#15803d" stroke-width="3"/>

  <!-- Antennas -->
  <path d="M 88 46 Q 80 28 72 32" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="71" cy="32" r="5" fill="#f59e0b" stroke="#15803d" stroke-width="1.5"/>
  <path d="M 112 46 Q 120 28 128 32" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="129" cy="32" r="5" fill="#f59e0b" stroke="#15803d" stroke-width="1.5"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="80" cy="85" rx="6" ry="4" fill="#f87171" opacity="0.6"/>
  <ellipse cx="120" cy="85" rx="6" ry="4" fill="#f87171" opacity="0.6"/>

  <!-- Big Round Reading Glasses -->
  <circle cx="86" cy="72" r="14" fill="#e0f2fe" opacity="0.8" stroke="#0f172a" stroke-width="3"/>
  <circle cx="114" cy="72" r="14" fill="#e0f2fe" opacity="0.8" stroke="#0f172a" stroke-width="3"/>
  <!-- Glasses Bridge -->
  <path d="M 100 72 Q 100 68 100 72" stroke="#0f172a" stroke-width="3" fill="none"/>
  <line x1="100" y1="71" x2="100" y2="73" stroke="#0f172a" stroke-width="3"/>

  <!-- Cute Eyes behind glasses -->
  <circle cx="87" cy="72" r="5" fill="#0f172a"/>
  <circle cx="89" cy="70" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="72" r="5" fill="#0f172a"/>
  <circle cx="115" cy="70" r="1.5" fill="#ffffff"/>

  <!-- Cheerful Smile -->
  <path d="M 94 88 Q 100 95 106 88" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Tiny Bowtie -->
  <polygon points="100,105 88,98 88,112" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
  <polygon points="100,105 112,98 112,112" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
  <circle cx="100" cy="105" r="3" fill="#fbbf24"/>

  <!-- Open Book Held in Front -->
  <!-- Left Page -->
  <path d="M 100 132 L 52 120 Q 50 148 54 172 L 100 178 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Right Page -->
  <path d="M 100 132 L 148 120 Q 150 148 146 172 L 100 178 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Red Book Spine/Cover border -->
  <path d="M 48 120 L 100 133 L 152 120 L 150 174 L 100 181 L 50 174 Z" fill="none" stroke="url(#bookCover)" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Text lines in book -->
  <line x1="62" y1="134" x2="90" y2="139" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="144" x2="88" y2="149" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="154" x2="91" y2="159" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="139" x2="138" y2="134" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="149" x2="136" y2="144" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="159" x2="138" y2="154" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Golden bookmark ribbon dangling -->
  <path d="M 100 132 Q 103 155 106 186 L 102 188 L 98 184 L 95 188 Z" fill="#f59e0b"/>
</svg>
