<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgBoy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="boyHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgBoy)" stroke="#0d9488" stroke-width="4"/>

  <!-- Neck & Blue Hoodie -->
  <rect x="88" y="104" width="24" height="22" fill="#fed7aa"/>
  <path d="M 58 126 C 72 118, 128 118, 142 126 L 152 182 L 48 182 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Headphones around neck -->
  <path d="M 68 110 C 68 130, 132 130, 132 110" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="62" y="100" width="12" height="20" rx="6" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>
  <rect x="126" y="100" width="12" height="20" rx="6" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>

  <!-- Head -->
  <ellipse cx="100" cy="78" rx="35" ry="34" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>

  <!-- Messy Spiky Cartoon Hair -->
  <path d="M 65 72 C 60 50, 75 32, 100 32 C 122 32, 138 48, 135 72 C 128 58, 115 62, 102 54 C 92 64, 78 58, 65 72 Z" fill="url(#boyHair)"/>
  <polygon points="70,45 80,32 86,44" fill="url(#boyHair)"/>
  <polygon points="90,38 102,24 108,38" fill="url(#boyHair)"/>
  <polygon points="112,38 125,28 128,42" fill="url(#boyHair)"/>

  <!-- Round Glasses -->
  <circle cx="84" cy="78" r="14" fill="#f8fafc" opacity="0.85" stroke="#0284c7" stroke-width="3"/>
  <circle cx="116" cy="78" r="14" fill="#f8fafc" opacity="0.85" stroke="#0284c7" stroke-width="3"/>
  <line x1="98" y1="78" x2="102" y2="78" stroke="#0284c7" stroke-width="3"/>

  <!-- Friendly Eyes -->
  <circle cx="85" cy="78" r="5" fill="#0f172a"/>
  <circle cx="87" cy="76" r="1.5" fill="#ffffff"/>
  <circle cx="115" cy="78" r="5" fill="#0f172a"/>
  <circle cx="117" cy="76" r="1.5" fill="#ffffff"/>

  <!-- Grin -->
  <path d="M 93 94 Q 100 102 107 94" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Stack of Colorful Books Below -->
  <!-- Bottom Book (Purple) -->
  <rect x="42" y="162" width="116" height="18" rx="4" fill="#9333ea" stroke="#7e22ce" stroke-width="2"/>
  <rect x="48" y="166" width="102" height="10" rx="2" fill="#faf5ff"/>
  <line x1="42" y1="171" x2="158" y2="171" stroke="#581c87" stroke-width="1.5"/>

  <!-- Middle Book (Red) -->
  <rect x="48" y="146" width="104" height="18" rx="4" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <rect x="54" y="150" width="90" height="10" rx="2" fill="#fef2f2"/>
  <line x1="48" y1="155" x2="152" y2="155" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Top Open Book (Golden Amber) -->
  <path d="M 100 134 L 54 124 L 56 146 L 100 152 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 100 134 L 146 124 L 144 146 L 100 152 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 50 124 L 100 135 L 150 124 L 148 148 L 100 154 L 52 148 Z" fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
</svg>
