<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgDet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="tweed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgDet)" stroke="#c2410c" stroke-width="4"/>

  <!-- Trench Coat & Collar -->
  <path d="M 58 130 C 72 120, 128 120, 142 130 L 152 182 L 48 182 Z" fill="url(#tweed)" stroke="#431407" stroke-width="2"/>
  <polygon points="100,128 85,145 100,140" fill="#fed7aa"/>
  <polygon points="100,128 115,145 100,140" fill="#fed7aa"/>
  <!-- Red necktie -->
  <polygon points="100,136 96,155 100,165 104,155" fill="#ef4444"/>

  <!-- Head -->
  <ellipse cx="100" cy="84" rx="35" ry="32" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Deerstalker Detective Hat -->
  <path d="M 60 72 C 60 40, 140 40, 140 72 Z" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <!-- Front and back visors -->
  <path d="M 52 74 C 70 66, 130 66, 148 74 L 140 78 C 120 72, 80 72, 60 78 Z" fill="#9a3412"/>
  <!-- Hat ribbon/bow -->
  <path d="M 94 38 Q 100 44 106 38" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <circle cx="100" cy="38" r="3" fill="#f59e0b"/>

  <!-- Curious Inquisitive Eyebrows -->
  <path d="M 76 68 Q 85 64 92 68" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 108 68 Q 115 62 124 66" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Keen Inquisitive Eyes -->
  <circle cx="84" cy="78" r="6" fill="#0f172a"/>
  <circle cx="86" cy="76" r="2" fill="#ffffff"/>
  <circle cx="116" cy="78" r="6" fill="#0f172a"/>
  <circle cx="118" cy="76" r="2" fill="#ffffff"/>

  <!-- Little Smirk -->
  <path d="M 96 98 Q 104 102 108 96" stroke="#431407" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Open Mystery Novel -->
  <path d="M 100 134 L 54 124 Q 52 152 56 172 L 100 178 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 100 134 L 146 124 Q 148 152 144 172 L 100 178 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 50 124 L 100 136 L 150 124 L 148 174 L 100 181 L 52 174 Z" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
  <text x="68" y="152" font-size="14" font-family="serif" font-weight="bold" fill="#ef4444">?</text>

  <!-- Magnifying Glass Inspecting the Book -->
  <circle cx="125" cy="142" r="18" fill="#e0f2fe" opacity="0.65" stroke="#d97706" stroke-width="4"/>
  <!-- Glare on glass -->
  <path d="M 115 132 A 12 12 0 0 1 135 136" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="138" y1="154" x2="155" y2="172" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
</svg>
