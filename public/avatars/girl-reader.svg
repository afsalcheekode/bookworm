<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGirl)" stroke="#f43f5e" stroke-width="4"/>

  <!-- Back Hair -->
  <circle cx="100" cy="90" r="54" fill="url(#hairGrad)"/>

  <!-- Neck & Yellow Sweater -->
  <rect x="88" y="112" width="24" height="20" fill="#fde68a"/>
  <path d="M 60 134 C 75 125, 125 125, 140 134 L 148 180 L 52 180 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="36" ry="34" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Hair Bangs -->
  <path d="M 64 75 C 64 45, 136 45, 136 75 C 126 62, 115 68, 100 64 C 85 68, 74 62, 64 75 Z" fill="url(#hairGrad)"/>
  <circle cx="60" cy="95" r="10" fill="url(#hairGrad)"/>
  <circle cx="140" cy="95" r="10" fill="url(#hairGrad)"/>
  <!-- Hair Clips / Ribbons -->
  <circle cx="68" cy="62" r="5" fill="#f43f5e"/>
  <circle cx="132" cy="62" r="5" fill="#f43f5e"/>

  <!-- Blush Cheeks -->
  <ellipse cx="76" cy="95" rx="7" ry="4" fill="#fb7185" opacity="0.7"/>
  <ellipse cx="124" cy="95" rx="7" ry="4" fill="#fb7185" opacity="0.7"/>

  <!-- Cute Starry Eyes behind stylish glasses -->
  <circle cx="82" cy="85" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
  <circle cx="118" cy="85" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
  <line x1="96" y1="85" x2="104" y2="85" stroke="#e11d48" stroke-width="3"/>

  <!-- Pupils with Stars -->
  <circle cx="82" cy="85" r="7" fill="#0f172a"/>
  <circle cx="84" cy="82" r="2.5" fill="#ffffff"/>
  <circle cx="118" cy="85" r="7" fill="#0f172a"/>
  <circle cx="120" cy="82" r="2.5" fill="#ffffff"/>

  <!-- Sweet Smile -->
  <path d="M 94 102 Q 100 108 106 102" stroke="#be123c" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Big Open Book Held in Hands -->
  <path d="M 100 135 L 48 122 Q 44 150 48 174 L 100 180 Z" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
  <path d="M 100 135 L 152 122 Q 156 150 152 174 L 100 180 Z" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <path d="M 44 122 L 100 136 L 156 122 L 154 176 L 100 183 L 46 176 Z" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Hands / Fingers Holding Book -->
  <ellipse cx="58" cy="148" rx="8" ry="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="142" cy="148" rx="8" ry="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>

  <!-- Heart & Reading Text lines on page -->
  <path d="M 72 138 Q 74 135 77 138 Q 80 135 82 138 Q 82 143 77 146 Q 72 143 72 138 Z" fill="#fb7185"/>
  <line x1="64" y1="152" x2="90" y2="155" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="162" x2="88" y2="165" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="145" x2="138" y2="140" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="155" x2="136" y2="150" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="165" x2="138" y2="160" stroke="#fda4af" stroke-width="2" stroke-linecap="round"/>
</svg>
